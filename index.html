<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noureddine Projects | مشاريع نور الدين</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 12px;
    }
    p {
      line-height: 1.6;
      color: #8b949e;
      font-size: 1.1rem;
    }
    .badge {
      display: inline-block;
      background: #238636;
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      margin: 15px 0;
    }
    .list {
      margin-top: 30px;
      text-align: right;
    }
    .project-item {
      background: #21262d;
      padding: 12px 18px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .project-item a {
      color: #58a6ff;
      text-decoration: none;
      font-weight: 600;
    }
    .project-item a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 الاستضافة شغالة بنجاح</div>
    <h1>مرحباً بك في منصة المشاريع</h1>
    <p>هاد الصفحة مربوطة مباشرة مع حساب GitHub ديالك (<b>noureddine-gpit</b>). أي مشروع أو تطبيق نصاوبوه غادي يتبوشا هنا أوتوماتيكياً وغادي تلقى الرابط ديالو واجد يخدم فالبلاصة!</p>
    <div class="list">
      <h3>المشاريع المتوفرة حالياً:</h3>
      <div class="project-item">
        <span>🏠 الصفحة الرئيسية والاستضافة الأساسية</span>
        <a href="#">نشط</a>
      </div>
    </div>
  </div>
</body>
</html>
