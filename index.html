<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noureddine Projects | مشاريع نور الدين</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 40px 30px;
      max-width: 650px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #58a6ff;
      margin-bottom: 8px;
    }
    p {
      line-height: 1.6;
      color: #8b949e;
      font-size: 1rem;
    }
    .badge {
      display: inline-block;
      background: #238636;
      color: white;
      padding: 5px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }
    .list {
      margin-top: 25px;
      text-align: right;
    }
    .project-item {
      background: #21262d;
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #30363d;
      transition: border-color 0.2s;
    }
    .project-item:hover {
      border-color: #58a6ff;
    }
    .project-info h3 {
      margin: 0 0 5px 0;
      color: #f0f6fc;
      font-size: 1.05rem;
    }
    .project-info p {
      margin: 0;
      font-size: 0.85rem;
      color: #8b949e;
    }
    .btn {
      background: #238636;
      color: white;
      text-decoration: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      white-space: nowrap;
    }
    .btn:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🚀 الاستضافة شغالة على GitHub Pages</div>
    <h1>مكتبة مشاريع نور الدين</h1>
    <p>جميع التطبيقات والمشاريع يتم رفعها تلقائياً هنا وتعمل مباشرة في المتصفح.</p>
    
    <div class="list">
      <div class="project-item">
        <div class="project-info">
          <h3>🌿 MetaMint (Metadata & Keywords Tool)</h3>
          <p>أداة إضافة الكلمات المفتاحية وبيانات EXIF / IPTC / XMP للصور بدون فقدان الجودة (JPG & PNG).</p>
        </div>
        <a href="metamint/" class="btn">تشغيل التطبيق ↗</a>
      </div>
    </div>
  </div>
</body>
</html>
